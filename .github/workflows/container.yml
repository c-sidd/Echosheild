name: Container

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/container.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: echosheild-backend:ci
          cache-from: type=gha,scope=echosheild-backend
          cache-to: type=gha,mode=max,scope=echosheild-backend
